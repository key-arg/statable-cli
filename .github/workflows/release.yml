name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Keyless signing exchanges this token for a short-lived certificate, so the
  # signature is bound to this workflow and this commit in a public
  # transparency log. There is no private key to leak or rotate.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The `secrets` context cannot be read from a step-level `if`, so the two
    # Docker Hub values are lifted into the job environment and tested there.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Without this the release is built on exactly the version go.mod
          # names, and go.mod names a floor rather than a preference. The
          # first release went out on a Go with seven known standard-library
          # vulnerabilities in net/http, crypto/tls and crypto/x509 -- the
          # three packages every request this tool makes goes through.
          check-latest: true
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # The image is built for linux/amd64 and linux/arm64 on an amd64 runner,
      # so the arm64 layer needs emulation, and buildx needs a builder that can
      # produce a multi-platform manifest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        # Same shape as the other optional publishers: no secret, no login, and
        # GoReleaser skips the image instead of failing the release.
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A separate token: the default one cannot write to another
          # repository, and the tap and the AUR package both live elsewhere.
          # Both are always defined, empty when the secret is not set, so a
          # release before those repositories exist publishes the archives and
          # quietly skips the two package managers rather than failing.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
