# GoReleaser builds every published artefact. Run `goreleaser check` after any
# edit; a release configuration that is only exercised on release day is a
# configuration that fails on release day.
version: 2

project_name: statable

before:
  hooks:
    - go mod tidy
    - go mod verify
    # The release must not be the first place a failing test is noticed.
    - go test ./...
    # Completions and man pages are generated from the command tree, so they
    # cannot describe a flag that no longer exists.
    - go run ./cmd/gen-docs .

builds:
  - id: statable
    main: ./cmd/statable
    binary: statable
    # No cgo. The keyring backends this uses are pure Go on every platform, so
    # a static binary runs on Alpine and on a distroless image, which is the
    # whole reason for choosing Go over Node here.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s -w drop the symbol table and DWARF. The version below is what a bug
      # report quotes, so it is stamped rather than left to the VCS fallback.
      - -s -w
      - -X github.com/key-arg/statable-cli/internal/cli.Version={{ .Version }}
      - -X github.com/key-arg/statable-cli/internal/cli.Commit={{ .FullCommit }}
      - -X github.com/key-arg/statable-cli/internal/cli.Date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible: the timestamp comes from the commit, not from the clock on
    # whichever runner happened to build it.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: statable
    ids: [statable]
    # An archive named for its platform is what every installer script and
    # every human looking at a releases page expects to find.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - src: completions/*
        dst: completions
      - src: manpages/*
        dst: manpages

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Signing is keyless: the signature is bound to the workflow identity in the
# public transparency log, so there is no private key to leak or rotate and
# anyone can verify who built the artefact and from which commit.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: key-arg
    name: statable-cli
  draft: false
  prerelease: auto
  footer: |
    ## Install

    macOS and Linux (Homebrew): `brew install key-arg/tap/statable`
    Anywhere with Go: `go install github.com/key-arg/statable-cli/cmd/statable@{{ .Tag }}`
    mise: `mise use -g "ubi:key-arg/statable-cli[exe=statable]"`

    Or download the archive for your platform below. There is deliberately no
    `curl | sh` installer.

    ### Verify what you downloaded

    ```
    cosign verify-blob checksums.txt \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github\.com/key-arg/statable-cli/\.github/workflows/.+' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --check checksums.txt --ignore-missing
    ```

    ### Statable

    [Docs](https://statable.com/docs/) · [Stats API](https://statable.com/docs/developers/stats-api/overview/) · [Blog](https://statable.com/blog/) · [Status](https://status.statable.com)

    Cookieless web analytics hosted in the EU: [statable.com](https://statable.com)

# Homebrew moved third-party binaries from formulae to casks, so `brews:` is
# deprecated. A cask ships the built binary rather than compiling from source,
# which is the point: nobody should need a Go toolchain to install a CLI.
homebrew_casks:
  - name: statable
    ids: [statable]
    # Two different rules apply here, and they pull opposite ways.
    #
    # A secret field is validated before it is rendered, and the validator
    # accepts nothing but a bare {{ .Env.NAME }} -- an `index .Env` expression
    # fails with "expected {{ .Env.VAR_NAME }} only". So `token` below has to
    # use that exact form.
    #
    # But {{ .Env.NAME }} is a hard error when the variable does not exist at
    # all. That is handled in the workflow instead: it always sets both
    # variables, empty when the secret is unset, so the name always exists.
    # skip_upload then decides whether to publish, and it is a plain template
    # with no such restriction.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: key-arg
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://statable.com
    description: Read your Statable analytics from a terminal, a script, or CI
    license: MIT
    binaries:
      - statable
    completions:
      bash: completions/statable.bash
      zsh: completions/statable.zsh
      fish: completions/statable.fish
    # Every page, not just the root one: `man statable-top` has to find its
    # own page, and the AUR package installs all of them.
    manpages:
      - manpages/*.1
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/statable"]
          end
    # Gatekeeper quarantines anything downloaded without a notarised
    # signature, and the first run then fails with a dialog rather than an
    # error a script can read. The hook above clears the attribute Homebrew
    # itself set, which is what every unsigned cask has to do.

# The image is built from the binary the release already produced, not from a
# separate `go build` inside a Dockerfile, so what runs in a container is the
# artefact that was signed and checksummed above.
#
# dockers_v2 rather than the older dockers/docker_manifests pair: buildx builds
# every platform and pushes the multi-architecture manifest in one run, because
# a multi-platform manifest cannot be assembled locally without pushing it.
dockers_v2:
  - id: statable
    ids: [statable]
    dockerfile: Dockerfile
    images:
      - docker.io/statable/statable
    tags:
      - "{{ .Version }}"
      # A prerelease must not move `latest`: `docker run statable/statable`
      # has to keep meaning the last stable version.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # Same guard as the cask and the AUR package: the workflow always defines
    # the variable, empty when the secret is unset, so a release without a
    # Docker Hub account publishes everything else instead of failing.
    disable: '{{ if index .Env "DOCKERHUB_TOKEN" }}false{{ else }}true{{ end }}'
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Read your Statable analytics from a terminal, a script, or CI
      org.opencontainers.image.url: https://statable.com
      org.opencontainers.image.documentation: https://statable.com/docs/
      org.opencontainers.image.source: https://github.com/key-arg/statable-cli
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.vendor: Key Arg B.V.

# winget is the installer that ships with Windows, and the only one of these
# whose manifest lives in somebody else's repository: the release opens a pull
# request against microsoft/winget-pkgs from our fork. Three catalogues
# (winstall.app and two others) rebuild themselves from that repository, so one
# merged manifest is also how Windows users find this at all.
winget:
  - name: statable
    package_identifier: KeyArg.Statable
    publisher: Key Arg B.V.
    publisher_url: https://statable.com
    publisher_support_url: https://github.com/key-arg/statable-cli/issues
    homepage: https://statable.com
    short_description: Read your Statable analytics from a terminal, a script, or CI
    description: |-
      The command-line client for Statable, cookieless web analytics hosted in
      the EU. It reads visitors, pageviews, sources, pages, goals and funnels
      over the Stats API and prints them as a table, JSON or CSV, and it can
      create and edit sites, goals and funnels as well. Threshold checks for CI
      exit 0 within bounds and 3 outside them.
    license: MIT
    license_url: https://github.com/key-arg/statable-cli/blob/main/LICENSE
    copyright: Key Arg B.V.
    release_notes_url: "https://github.com/key-arg/statable-cli/releases/tag/{{ .Tag }}"
    tags:
      - analytics
      - cli
      - privacy
      - web-analytics
    # Same guard as every other publisher here: no token, no manifest, and the
    # rest of the release goes out as usual.
    skip_upload: '{{ if index .Env "WINGET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: key-arg
      name: winget-pkgs
      branch: "statable-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# Scoop is the other Windows installer, and its model is the tap model: a
# bucket repository we own, so there is no queue and no reviewer. The manifest
# stays in the root of that repository -- `scoop bucket list` reports zero
# manifests for a bucket that keeps them in a subdirectory.
scoops:
  - name: statable
    ids: [statable]
    homepage: https://statable.com
    description: Read your Statable analytics from a terminal, a script, or CI
    license: MIT
    # Same split as the cask: skip_upload is a plain template, token is a
    # secret field and must be the bare {{ .Env.NAME }} form.
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: key-arg
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"

# The AUR package is published by the release itself, so its checksums can
# never drift from the artefacts they describe -- which is the failure mode of
# a hand-maintained PKGBUILD.
aurs:
  - name: statable-bin
    ids: [statable]
    homepage: https://statable.com
    description: Read your Statable analytics from a terminal, a script, or CI
    license: MIT
    maintainers:
      - "Yevhen Skrypets <yevhen@skrypets.com>"
    # Same split as the cask above: disable is a plain template, private_key is
    # a secret field and must be the bare form.
    disable: '{{ if index .Env "AUR_KEY" }}false{{ else }}true{{ end }}'
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/statable-bin.git
    provides: [statable]
    conflicts: [statable]
    package: |-
      install -Dm755 "./statable" "${pkgdir}/usr/bin/statable"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/statable-bin/LICENSE"

      install -Dm644 "./completions/statable.bash" "${pkgdir}/usr/share/bash-completion/completions/statable"
      install -Dm644 "./completions/statable.zsh" "${pkgdir}/usr/share/zsh/site-functions/_statable"
      install -Dm644 "./completions/statable.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/statable.fish"

      for page in ./manpages/*.1; do
        install -Dm644 "$page" "${pkgdir}/usr/share/man/man1/$(basename "$page")"
      done
